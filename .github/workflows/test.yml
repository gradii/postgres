# The same jobs live in .cnb/test.yml: both call .cnb/ci.sh, which builds a
# temporary workspace out of the sibling repositories and tests every root
# module, so a change here is checked against the framework's main rather than
# against the released tag this module pins. The integration job is the port of
# the .test-external pipeline there.

name: Test
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
env:
  # The sibling repositories are cloned from GitHub here; CNB uses its own host.
  # The entry for this repository is ignored: ci.sh always tests the checkout the
  # runner supplied, so a pull request is tested as it is.
  GRADII_FRAMEWORK_URL: https://github.com/gradii/framework
  GRADII_MYSQL_URL: https://github.com/gradii/mysql
  GRADII_POSTGRES_URL: https://github.com/gradii/postgres
  GRADII_SQLITE_URL: https://github.com/gradii/sqlite
  GRADII_SQLSERVER_URL: https://github.com/gradii/sqlserver
  GRADII_FRAMEWORK_REF: main
  GRADII_MYSQL_REF: main
  GRADII_POSTGRES_REF: main
  GRADII_SQLITE_REF: main
  GRADII_SQLSERVER_REF: main
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test all root modules
        run: bash .cnb/ci.sh unit
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the integration suite
        run: bash .cnb/ci.sh integration
