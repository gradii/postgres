# Coverage of this module, measured inside the workspace the test workflow
# builds. The upload is allowed to fail: the repository has no CODECOV_TOKEN
# secret, so it only starts reporting once the project is registered.

name: Codecov
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
env:
  # The sibling repositories are cloned from GitHub here; CNB uses its own host.
  # The entry for this repository is ignored: ci.sh always tests the checkout the
  # runner supplied, so a pull request is tested as it is.
  GRADII_FRAMEWORK_URL: https://github.com/gradii/framework
  GRADII_MYSQL_URL: https://github.com/gradii/mysql
  GRADII_POSTGRES_URL: https://github.com/gradii/postgres
  GRADII_SQLITE_URL: https://github.com/gradii/sqlite
  GRADII_SQLSERVER_URL: https://github.com/gradii/sqlserver
  GRADII_FRAMEWORK_REF: main
  GRADII_MYSQL_REF: main
  GRADII_POSTGRES_REF: main
  GRADII_SQLITE_REF: main
  GRADII_SQLSERVER_REF: main
jobs:
  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the workspace
        run: echo "GOWORK=$(bash .cnb/ci.sh workspace | sed -n 's/^GOWORK=//p')" >> "$GITHUB_ENV"
      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out ./...
      - name: Upload coverage report to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
